[project]
name = "zen-patch-forge"
version = "0.1.0"
description = "ZEN-Core Patch Forge desktop UI for Roland ZENOLOGY .svz generation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "customtkinter>=5.2.0",
  "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
zen-patch-forge = "zen_patch_forge.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["zen_patch_forge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
