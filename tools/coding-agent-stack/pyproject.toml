[project]
name = "coding-agent-stack"
version = "0.1.0"
description = "LangGraph ReAct coding agent with harness loop, sandbox, and mobile PWA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
llm = [
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
  "langchain-openai>=0.2.0",
  "langchain-anthropic>=0.2.0",
]
e2b = ["e2b-code-interpreter>=1.0.0"]
obs = ["langfuse>=2.0.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24.0"]

[project.scripts]
coding-agent = "coding_agent_stack.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["coding_agent_stack*"]
