[project]
name = "disklordz-vst-factory"
version = "0.1.0"
description = "DiskLordz VST Factory — AI orchestration for JUCE plugins"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24.0", "httpx>=0.27.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["vst_factory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
