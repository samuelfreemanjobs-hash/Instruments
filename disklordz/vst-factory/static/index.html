<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DiskLordz VST Factory</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>DISKLORDZ VST FACTORY</h1>
    <p class="tagline">AI Development Studio · Local build engine</p>
  </header>
  <main class="layout">
    <section class="panel" id="builder">
      <h2>AI Builder</h2>
      <div class="chips" id="class-chips"></div>
      <label>Describe the plugin</label>
      <textarea id="prompt" rows="6" placeholder="Vintage Memphis chord generator with 16 pads…"></textarea>
      <label>Plugin name (PascalCase, optional)</label>
      <input id="plugin-name" type="text" placeholder="Auto from prompt" />
      <button id="btn-create" type="button">Create project</button>
      <button id="btn-scaffold" type="button" disabled>Scaffold APC + VST</button>
    </section>
    <section class="panel" id="build-center">
      <h2>Build Center</h2>
      <p id="project-meta">No project selected.</p>
      <div id="pipeline-strip" class="pipeline-strip" aria-label="Lifecycle pipeline"></div>
      <div id="approval-banner" class="approval-banner hidden" role="status"></div>
      <button id="btn-sync" type="button" disabled>Sync APC phase</button>
      <button id="btn-build" type="button" disabled>Compile (Linux)</button>
      <button id="btn-test" type="button" disabled>Run factory QA</button>
      <button id="btn-ship" type="button" disabled>Ship package</button>
      <button id="btn-prompt" type="button" disabled>Copy Cursor prompt</button>
      <pre id="log" class="log"></pre>
    </section>
    <section class="panel" id="plugin-lab">
      <h2>Plugin Lab</h2>
      <h3>Module library</h3>
      <div id="modules-dsp" class="module-grid"></div>
      <h3>CHORD ENGINE reference</h3>
      <pre id="chord-ref" class="log small"></pre>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
