<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="description" content="DiskLordz Audio — sprint checklist and roadmap command" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <title>DiskLordz Audio Command</title>
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <span class="logo" aria-hidden="true">🎛️</span>
        <div>
          <h1>DiskLordz Audio Command</h1>
          <p class="tagline">Built for the Underground · business execution cockpit</p>
        </div>
      </div>
      <div class="score" id="score" aria-live="polite">0 / 10</div>
    </header>

    <section class="panel" aria-labelledby="phase-heading">
      <h2 id="phase-heading">Current focus</h2>
      <select id="phase" aria-label="Roadmap phase">
        <option value="foundation">M1 — Foundation</option>
        <option value="milestone-001">Milestone 001 — Plugin shell + MIDI</option>
        <option value="alpha">M2–3 — CHORD ENGINE alpha</option>
        <option value="beta">M4 — Beta</option>
        <option value="launch-prep">M5 — Launch prep</option>
        <option value="launch">M6 — Launch</option>
      </select>
      <p class="hint">VST/C++ work stays in <strong>Cursor</strong>. Use this board with <strong>audio-business-copilot</strong>.</p>
    </section>

    <section class="panel">
      <h2>30-day sprint checklist</h2>
      <ul id="checklist" class="checklist"></ul>
    </section>

    <section class="panel">
      <h2>Notes</h2>
      <textarea id="weekly-notes" rows="4" placeholder="Blockers, build failures, next week focus…"></textarea>
    </section>

    <footer class="actions">
      <button type="button" id="export-json">Export progress JSON</button>
      <button type="button" id="copy-review" class="primary">Copy weekly review snippet</button>
    </footer>

    <script src="app.js" type="module"></script>
  </body>
</html>
