# Activepieces — self-hosted (Disklordz automation layer)
# Docs: https://www.activepieces.com/docs/install/options/docker-compose
# UI default: http://localhost:8080

services:
  app:
    image: ghcr.io/activepieces/activepieces:0.91.0
    container_name: disklordz-activepieces-app
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - postgres
      - redis
    env_file: .env
    environment:
      AP_CONTAINER_TYPE: APP
    volumes:
      - ./cache:/usr/src/app/cache
    networks:
      - activepieces

  worker:
    image: ghcr.io/activepieces/activepieces:0.91.0
    container_name: disklordz-activepieces-worker
    restart: unless-stopped
    depends_on:
      - app
    env_file: .env
    environment:
      AP_CONTAINER_TYPE: WORKER
    volumes:
      - ./cache:/usr/src/app/cache
    networks:
      - activepieces

  postgres:
    image: pgvector/pgvector:0.8.0-pg14
    container_name: disklordz-activepieces-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${AP_POSTGRES_DATABASE}
      POSTGRES_PASSWORD: ${AP_POSTGRES_PASSWORD}
      POSTGRES_USER: ${AP_POSTGRES_USERNAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - activepieces

  redis:
    image: redis:7.0.7
    container_name: disklordz-activepieces-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - activepieces

volumes:
  postgres_data:
  redis_data:

networks:
  activepieces:
