# Compile all logue SDK user oscillators (v1 × 3 platforms + NTS-1 mkII).
# Artifacts are compile-only — not loaded on hardware in CI.

name: logue NTS-1 units

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (branch, tag, or SHA)
        required: false
        default: main
        type: string
  repository_dispatch:
    types: [build-logue-units]
  push:
    branches: [main]
    paths:
      - 'src/oscillators/**'
      - 'src/mkii/**'
      - 'src/shared/**'
      - 'src/effects/**'
      - 'tools/build*.sh'
      - 'tools/mkii/**'
      - 'tools/package-nts1.sh'
      - 'tools/build-all-units.sh'
      - '.github/workflows/logue-nts1-units.yml'
  pull_request:
    paths:
      - 'src/oscillators/**'
      - 'src/mkii/**'
      - 'src/shared/**'
      - 'src/effects/**'
      - 'tools/build*.sh'
      - 'tools/mkii/**'
      - 'tools/package-nts1.sh'
      - 'tools/build-all-units.sh'
      - '.github/workflows/logue-nts1-units.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve checkout ref
        id: checkout_ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            ref="${{ github.event.client_payload.ref }}"
            echo "value=${ref:-main}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.ref }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.checkout_ref.outputs.value }}

      - name: Install ARM GCC
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi make

      - name: Bootstrap logue-sdk
        run: |
          export MKII_SKIP_GCC=1
          ./tools/mkii-automate.sh bootstrap

      - name: Build all units
        run: |
          export LOGUE_SDK="${{ github.workspace }}/.deps/logue-sdk"
          ./tools/build-all-units.sh --all-platforms --mkii --package

      - name: Upload unit packages (all platforms + mkII)
        uses: actions/upload-artifact@v4
        with:
          name: logue-custom-units
          path: |
            release/nts1-custom-oscillators/
            release/logue-build-status.tsv
          if-no-files-found: error
          retention-days: 30

      - name: Upload mkII units only
        uses: actions/upload-artifact@v4
        with:
          name: logue-nts1-mkii-only
          path: release/nts1-custom-oscillators/mkII-nts1mkiiunit/
          if-no-files-found: error
          retention-days: 30
