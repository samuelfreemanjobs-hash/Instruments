name: VST Preset Daily Batch

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: Presets per product (WAVE-9090 + Plugg VA)
        required: false
        default: "8"

permissions:
  contents: write

jobs:
  daily-batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ingest hand-curated lineage
        run: python3 scripts/vst/ingest_vst_lineage.py

      - name: Quality gate (gold slots)
        run: python3 scripts/vst/test_preset_quality.py

      - name: Run daily preset batch
        run: |
          python3 scripts/vst/daily_preset_batch.py \
            --batch-size "${{ github.event.inputs.batch_size || '8' }}"

      - name: Verify factory counts
        run: |
          python3 scripts/vst/verify_factory_preset_counts.py
          python3 disklordz/integrations/agents/vst_preset_agent.py --self-test

      - name: Commit daily preset promotion
        run: |
          git config user.name "vst-preset-agent"
          git config user.email "vst-preset-agent@users.noreply.github.com"
          git add data/vst-preset-lineage/ Wave9090/Source/Presets/ActiveAgentSeeds.cpp PluggVA/Source/Presets/ActiveAgentSeeds.cpp
          if git diff --staged --quiet; then
            echo "No new presets to commit."
            exit 0
          fi
          git commit -m "chore(vst): daily preset batch (VST Preset Agent)"
          git push
