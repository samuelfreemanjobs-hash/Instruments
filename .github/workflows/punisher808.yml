name: DiskLordz 808-Punisher

on:
  push:
    branches: [main, "cursor/**"]
    paths:
      - "vst/Punisher808/**"
      - "shared/dsp/**"
      - ".github/workflows/punisher808.yml"
  pull_request:
    branches: [main]
    paths:
      - "vst/Punisher808/**"
      - "shared/dsp/**"
      - ".github/workflows/punisher808.yml"

jobs:
  linux-build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vst/Punisher808
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libasound2-dev libfreetype6-dev libgl1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libgtk-3-dev unzip xvfb

      - name: Fetch JUCE 8.0.6
        working-directory: ${{ github.workspace }}
        run: |
          git clone --branch 8.0.6 --depth 1 https://github.com/juce-framework/JUCE.git vst/JUCE

      - name: Configure and build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++
          cmake --build build -j$(nproc) --target Punisher808_VST3 Punisher808_Standalone Punisher808ProcessorTests

      - name: Processor contract tests
        run: ctest --test-dir build -R Punisher808ProcessorContracts --output-on-failure

      - name: pluginval (Linux, strictness 5)
        working-directory: ${{ github.workspace }}
        env:
          CI: true
        run: |
          python3 scripts/vst/run_pluginval.py --install-only
          xvfb-run -a python3 scripts/vst/run_pluginval.py --strictness 5 --discover vst/Punisher808/build

  windows-build-pluginval:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: vst/Punisher808
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Fetch JUCE 8.0.6
        working-directory: ${{ github.workspace }}
        shell: bash
        run: git clone --branch 8.0.6 --depth 1 https://github.com/juce-framework/JUCE.git vst/JUCE

      - name: Configure and build (Visual Studio 2022)
        shell: cmd
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release --target Punisher808_VST3 Punisher808ProcessorTests

      - name: Processor contract tests
        shell: cmd
        run: ctest --test-dir build -C Release -R Punisher808ProcessorContracts --output-on-failure

      - name: Install pluginval (Windows)
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          $ver = "1.0.4"
          $url = "https://github.com/Tracktion/pluginval/releases/download/v$ver/pluginval_Windows.zip"
          $zip = "$env:RUNNER_TEMP\pluginval.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\pluginval"
          $bin = Get-ChildItem -Path "$env:RUNNER_TEMP\pluginval" -Recurse -Filter pluginval.exe | Select-Object -First 1
          echo "PLUGINVAL_BIN=$($bin.FullName)" >> $env:GITHUB_ENV

      - name: pluginval (Windows, strictness 5)
        working-directory: ${{ github.workspace }}
        env:
          CI: true
        shell: pwsh
        run: |
          python scripts/vst/run_pluginval.py --strictness 5 --discover vst/Punisher808/build

      - name: Upload VST3 artefact
        uses: actions/upload-artifact@v4
        with:
          name: DiskLordz-808-Punisher-vst3-windows
          path: vst/Punisher808/build/Punisher808_artefacts/Release/VST3/*.vst3
          if-no-files-found: error
