name: MeterTap Phase 4

on:
  push:
    paths:
      - "vst/MeterTap/**"
      - "vst/factory-lib/analysis/**"
      - "plugins/MeterTap/**"
      - ".github/workflows/metertap.yml"
      - "tools/build-vst.sh"
      - "vst-testing-ops/**"
      - "JUCE_VERSION"
  pull_request:
    paths:
      - "vst/MeterTap/**"
      - "vst/factory-lib/analysis/**"
      - "plugins/MeterTap/**"
      - ".github/workflows/metertap.yml"
      - "tools/build-vst.sh"
      - "vst-testing-ops/**"
      - "JUCE_VERSION"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++-12 gcc-12 libstdc++-12-dev cmake pkg-config \
            libasound2-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev \
            libx11-dev libxrandr-dev libxcursor-dev libxinerama-dev libxext-dev \
            libcurl4-openssl-dev unzip xvfb

      - name: Fetch JUCE
        run: |
          TAG="$(tr -d '[:space:]' < JUCE_VERSION)"
          HAVE=""
          if [[ -f vst/JUCE/CMakeLists.txt ]]; then
            HAVE="$(git -C vst/JUCE describe --tags --exact-match HEAD 2>/dev/null || true)"
          fi
          if [[ "${HAVE}" != "${TAG}" ]]; then
            rm -rf vst/JUCE
            git clone --depth 1 --branch "${TAG}" https://github.com/juce-framework/JUCE.git vst/JUCE
          fi

      - name: Cache pluginval binary
        uses: actions/cache@v4
        with:
          path: |
            build/tools/pluginval
            vst-testing-ops/bin
          key: pluginval-${{ runner.os }}-1.0.4

      - name: Install pluginval
        run: python3 vst-testing-ops/test_runner.py --install-pluginval

      - name: Phase 4 verify
        env:
          CXX: g++-12
          CC: gcc-12
        run: xvfb-run -a bash plugins/MeterTap/scripts/verify-phase4.sh
