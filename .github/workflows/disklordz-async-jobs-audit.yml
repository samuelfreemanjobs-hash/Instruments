name: Disklordz async jobs audit

on:
  schedule:
    - cron: "0 16 * * 3"
  workflow_dispatch:

jobs:
  async:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: disklordz/website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: disklordz/website/package-lock.json
      - run: npm ci && npm run build
      - name: Launch async jobs agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: bash disklordz/automation/scripts/trigger_async_jobs.sh
