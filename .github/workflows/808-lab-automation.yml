name: 808 Lab repo automation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "disklordz/website/scripts/automate-808-lab-repo.sh"
      - "disklordz/website/scripts/export-mpc500-sprint-all.ts"
      - "disklordz/website/scripts/verify-producer-signoff.ts"
      - ".github/workflows/808-lab-automation.yml"

jobs:
  repo-pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: disklordz/website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: disklordz/website/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy soundfile
      - run: npm ci
      - run: npm run automate:808-lab-repo -- --skip-regenerate
        env:
          # export-sprint skipped; kits must already be in tree

  producer-gate:
    runs-on: ubuntu-latest
    needs: repo-pipeline
    continue-on-error: true
    defaults:
      run:
        working-directory: disklordz/website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: disklordz/website/package-lock.json
      - run: npm ci
      - run: npm run verify:producer-signoff
