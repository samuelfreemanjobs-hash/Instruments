# PM Agent — run executable fleet roles (safe local checks + optional prod verify)
name: Agent fleet execute

on:
  schedule:
    - cron: "0 15 * * 1-5"
  workflow_dispatch:

jobs:
  execute-roles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fleet execute (prompt-coach chunk, profit check, optional verify)
        run: python3 disklordz/agents/workflows/fleet_execute.py
        env:
          DISKLORDZ_URL: ${{ secrets.DISKLORDZ_VERIFY_BASE_URL }}
