# Scheduled Plugin Factory release (V Voyager + registry plugins).
name: Scheduled Plugin Factory QA

on:
  schedule:
    - cron: "0 12 * * 1,3,5" # Mon/Wed/Fri 12:00 UTC
  workflow_dispatch:

jobs:
  factory-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin-factory
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++-12 gcc-12 libasound2-dev libfreetype-dev libgl1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libgtk-3-dev unzip curl xvfb

      - name: Factory release (build + verify + pluginval + ship)
        env:
          CI: true
          FACTORY_VST3_INSTALL_DIR: ${{ github.workspace }}/build/factory-shipped-vst3
        run: ./scripts/factory.sh release

      - name: Assert V Voyager VST3 + 24 factory presets
        run: |
          test -d "$GITHUB_WORKSPACE/build/factory-shipped-vst3/V Voyager.vst3"
          "$GITHUB_WORKSPACE/plugin-factory/build/plugins/moog-voyager/VoyagerPresetTests"
