name: Disklordz audio QA weekly

on:
  schedule:
    - cron: "0 15 * * 6"
  workflow_dispatch:

jobs:
  audio-qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: disklordz/website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: disklordz/website/package-lock.json
      - run: npm ci && npm run factory:dsp-regression
      - name: Launch audio QA agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: bash disklordz/automation/scripts/trigger_audio_qa.sh
