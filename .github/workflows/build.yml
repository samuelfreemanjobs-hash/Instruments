name: Build

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential g++ libasound2-dev libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxinerama-dev libxcursor-dev libxrandr-dev \
            libgl1-mesa-dev libcurl4-openssl-dev pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev
      - name: Configure & build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++ -DCMAKE_C_COMPILER=gcc
          cmake --build build -j$(nproc)
