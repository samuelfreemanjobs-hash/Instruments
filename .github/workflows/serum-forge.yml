name: Serum Forge

on:
  push:
    paths:
      - "tools/serum-forge/**"
      - ".github/workflows/serum-forge.yml"
  pull_request:
    paths:
      - "tools/serum-forge/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/serum-forge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/serum-forge/requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - run: pytest tests -v
      - run: python scripts/smoke.py
