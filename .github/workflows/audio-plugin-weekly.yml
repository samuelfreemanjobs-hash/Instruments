name: Audio plugin weekly review

on:
  schedule:
    - cron: "0 12 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 disklordz/audio-command/scripts/weekly_review.py
      - run: python3 scripts/audio-plugin/factory-queue.py
      - name: Commit review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add disklordz/audio-command/reviews/ disklordz/audio-command/data/PASTE_TO_FACTORY.md || true
          git diff --cached --quiet || git commit -m "chore(audio-plugin): weekly review"
          git push origin HEAD:"${{ github.ref_name }}" || true
