# 24/7 tick: Antigravity dispatch + queue health + Cursor Cloud agent launch.
name: Autonomous coding agent tick

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Queue tick (Antigravity + progress check)
        run: |
          chmod +x scripts/antigravity-bridge/sync-all-antigravity.sh
          python3 scripts/autonomous-coder/tick.py --check-progress
          python3 scripts/autonomous-coder/tick.py
      - name: Emit Cloud slice artifact
        run: |
          python3 scripts/autonomous-coder/tick.py --emit-slice
          mkdir -p /tmp/slice
          cp -f .cursor/autonomous-coder/NEXT_SLICE.md /tmp/slice/ 2>/dev/null || echo "no slice"
      - name: Route job to agent (free tier or Cursor)
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/autonomous-coder/tick.py --launch-agent
      - name: Persist state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add disklordz/autonomous-coder/state.json .cursor/autonomous-coder/ || true
          git diff --cached --quiet || git commit -m "chore(autonomous-coder): scheduled tick"
          git push origin HEAD:"${{ github.ref_name }}" || true