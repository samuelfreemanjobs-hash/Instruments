name: Disklordz website

on:
  push:
    paths:
      - "disklordz/website/**"
      - ".github/workflows/disklordz-website.yml"
  pull_request:
    paths:
      - "disklordz/website/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: disklordz/website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: disklordz/website/package-lock.json
      - run: npm ci
      - run: npm run build
