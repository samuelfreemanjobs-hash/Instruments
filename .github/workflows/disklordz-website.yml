name: Disklordz website

on:
  push:
    paths:
      - "disklordz/website/**"
      - "disklordz/daw-inbox/**"
      - ".github/workflows/disklordz-website.yml"
  pull_request:
    paths:
      - "disklordz/website/**"
      - "disklordz/daw-inbox/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: disklordz/website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: disklordz/website/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Smoke (guest generate + factory)
        run: |
          npm run start -- -p 3000 &
          pid=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/api/health >/dev/null && break
            sleep 1
          done
          DISKLORDZ_URL=http://127.0.0.1:3000 npm run verify:go-live
          kill "$pid" || true
      - run: npm ci
        working-directory: disklordz/daw-inbox
      - run: node --check bin/watch.mjs
        working-directory: disklordz/daw-inbox
