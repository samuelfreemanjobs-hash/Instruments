name: drumsmith

on:
  push:
    paths:
      - "claude/drumsmith/**"
      - ".github/workflows/drumsmith.yml"
  pull_request:
    paths:
      - "claude/drumsmith/**"

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: DRUMSMITH self_test
        run: python3 claude/drumsmith/scripts/self_test.py