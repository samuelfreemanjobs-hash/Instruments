name: Sound factory CI

on:
  push:
    branches: [main, 'cursor/**']
    paths:
      - 'Rev2Trap/**'
      - 'disklordz/sound-factory/**'
  pull_request:
    paths:
      - 'Rev2Trap/**'
      - 'disklordz/sound-factory/**'

jobs:
  rev2-factory-chunk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++-12 libstdc++-12-dev \
            libasound2-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev \
            libx11-dev libxrandr-dev libxcursor-dev libxinerama-dev libxext-dev \
            libcurl4-openssl-dev

      - name: Configure and build Rev2Trap
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-12 -DCMAKE_C_COMPILER=gcc-12
          cmake --build build -j$(nproc) --target Rev2TrapOfflineRender Rev2TrapTests SpectralDiff

      - name: Rev2Trap smoke test
        run: ctest -R Rev2TrapSmoke --test-dir build --output-on-failure

      - name: Factory smoke + batch chunk
        run: |
          ./disklordz/sound-factory/tests/run_tests.sh
          python3 disklordz/sound-factory/scripts/run_product_batch.py \
            --catalog disklordz/sound-factory/catalog/rev2_trap128_catalog.json \
            --out /tmp/factory-ci --engine rev2trap --limit 4 --best-of 2
