name: design-system

on:
  pull_request:
    paths:
      - "vst/factory-lib/**"
      - ".github/workflows/design-system.yml"
  push:
    branches: [main, cursor/design-system]
    paths:
      - "vst/factory-lib/**"
      - ".github/workflows/design-system.yml"
  workflow_dispatch:

jobs:
  tokens-and-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python token contract + generator freshness
        run: |
          set -euo pipefail
          DS=vst/factory-lib/design-system
          python3 "$DS/scripts/check_tokens.py" --check-preview --check-generated
          python3 "$DS/scripts/gen_juce_tokens.py" --all --check
          python3 -m unittest discover -s "$DS/scripts" -p "test_*.py" -v

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-12 cmake ninja-build pkg-config \
            libasound2-dev libfreetype6-dev libx11-dev libxinerama-dev \
            libxrandr-dev libxcursor-dev libgl1-mesa-dev xvfb

      - name: Configure factory GUI (Release, no LTO)
        run: |
          cmake -B build-factory-gui -S vst/factory-lib -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DCMAKE_C_COMPILER=gcc-12 \
            -DFACTORY_GUI_THEME=disklordz \
            -DFACTORY_GUI_BUILD_GALLERY=ON \
            -DFACTORY_GUI_BUILD_TESTS=ON

      - name: Build gallery + render tests
        run: |
          cmake --build build-factory-gui -j "$(nproc)" \
            --target FactoryGuiGallery FactoryGuiRenderTests

      - name: Run render tests (all themes)
        run: |
          cd build-factory-gui
          xvfb-run -a ctest --output-on-failure -R 'FactoryGuiRenderTests_'

      - name: Upload PNG renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-gui-renders
          path: build-factory-gui/gui-renders/
          if-no-files-found: warn
