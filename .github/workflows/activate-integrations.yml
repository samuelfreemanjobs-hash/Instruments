# Migrations (incl. pgvector) → RAG embed → Vercel integration env → optional deploy → verify
name: Activate Disklordz integrations

on:
  workflow_dispatch:
    inputs:
      skip_migrations:
        description: Skip Supabase db push
        type: boolean
        default: false
      skip_rag_embed:
        description: Skip OpenAI embed + upsert
        type: boolean
        default: false
      sync_vercel_env:
        description: Push integration env vars to Vercel
        type: boolean
        default: true
      skip_deploy:
        description: Skip Vercel deploy hook
        type: boolean
        default: false
      skip_verify:
        description: Skip remote integration verify
        type: boolean
        default: false

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: disklordz/website/package-lock.json

      - name: Chunk RAG corpus
        run: python3 disklordz/rag/scripts/chunk_corpus.py

      - uses: supabase/setup-cli@v1
        if: ${{ inputs.skip_migrations != true }}
        with:
          version: latest

      - name: Supabase db push
        if: ${{ inputs.skip_migrations != true }}
        working-directory: disklordz/website
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push

      - name: Embed and upsert RAG
        if: ${{ inputs.skip_rag_embed != true }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Skipping embed — OPENAI_API_KEY or SUPABASE_SERVICE_ROLE_KEY missing"
            exit 0
          fi
          python3 disklordz/rag/scripts/embed_and_upsert.py

      - name: Build website
        working-directory: disklordz/website
        run: npm ci && npm run build

      - name: Sync Vercel env (core + integrations)
        if: ${{ inputs.sync_vercel_env == true }}
        working-directory: disklordz/website
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRO_PRICE_ID: ${{ secrets.STRIPE_PRO_PRICE_ID }}
          SAAS_DAILY_GEN_LIMIT: ${{ secrets.SAAS_DAILY_GEN_LIMIT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          INNGEST_EVENT_KEY: ${{ secrets.INNGEST_EVENT_KEY }}
          INNGEST_SIGNING_KEY: ${{ secrets.INNGEST_SIGNING_KEY }}
          DISKLORDZ_ENGINE: ${{ secrets.DISKLORDZ_ENGINE }}
          DISKLORDZ_AUDIOCRAFT_ENGINE_URL: ${{ secrets.DISKLORDZ_AUDIOCRAFT_ENGINE_URL }}
          DISKLORDZ_STABLE_AUDIO_ENGINE_URL: ${{ secrets.DISKLORDZ_STABLE_AUDIO_ENGINE_URL }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Need VERCEL_TOKEN and VERCEL_PROJECT_ID"
            exit 1
          fi
          bash scripts/sync-vercel-env.sh
          bash scripts/sync-integration-env-vercel.sh

      - name: Trigger production deploy
        if: ${{ inputs.skip_deploy != true }}
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "Skip deploy — VERCEL_DEPLOY_HOOK_URL not set"
            exit 0
          fi
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"

      - name: Verify integrations (production)
        if: ${{ inputs.skip_verify != true }}
        env:
          DISKLORDZ_URL: ${{ secrets.DISKLORDZ_URL }}
          INNGEST_EVENT_KEY: ${{ secrets.INNGEST_EVENT_KEY }}
        run: |
          sleep 30
          bash disklordz/integrations/scripts/verify-integrations.sh
