# Dispatches next item from active-queue.json into inbox/ (Antigravity active mode).
name: Antigravity dispatch active queue

on:
  schedule:
    # Mon/Wed/Fri 16:00 UTC
    - cron: "0 16 * * 1,3,5"
  workflow_dispatch:
    inputs:
      wo_id:
        description: Optional WO-AG-xxx (blank = next pending)
        required: false
        default: ""
      push:
        description: Push handoff commit to this branch
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Dispatch next queue item
        env:
          WO_ID: ${{ github.event.inputs.wo_id }}
        run: |
          chmod +x scripts/antigravity-bridge/antigravity-bridge.sh
          chmod +x scripts/antigravity-bridge/dispatch-active.sh
          args=( )
          if [[ -n "${WO_ID}" ]]; then
            args+=(--wo "${WO_ID}")
          fi
          if [[ "${{ github.event_name }}" == "schedule" ]] || [[ "${{ github.event.inputs.push }}" == "true" ]]; then
            args+=(--push)
          else
            args+=(--dry-run)
          fi
          ./scripts/antigravity-bridge/dispatch-active.sh "${args[@]}" || true
      - name: Push queue state
        if: github.event_name == 'schedule' || github.event.inputs.push == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push origin HEAD:"${{ github.ref_name }}" || echo "Nothing to push or push skipped"
