name: Build MyFirstPlugin

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  linux-vst3:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MyFirstPlugin
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libasound2-dev libfreetype-dev libgl1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libgtk-3-dev

      - name: Configure and build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++
          cmake --build build -j$(nproc)

  windows-vst3:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: MyFirstPlugin
    steps:
      - uses: actions/checkout@v4

      - name: Configure and build (CMake preset)
        run: |
          cmake --preset windows-vs-release
          cmake --build --preset windows-vs-release
