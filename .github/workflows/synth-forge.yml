name: SynthForge

on:
  push:
    paths:
      - "tools/synth-forge/**"
      - ".github/workflows/synth-forge.yml"
  pull_request:
    paths:
      - "tools/synth-forge/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/synth-forge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/synth-forge/requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - run: pytest tests -v
