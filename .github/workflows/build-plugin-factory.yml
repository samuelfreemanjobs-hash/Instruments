name: Build Plugin Factory OS

on:
  push:
    branches: [main, "cursor/**"]
    paths:
      - "plugin-factory/**"
      - "vst-testing-ops/business_pipeline.py"
      - ".github/workflows/build-plugin-factory.yml"
  pull_request:
    branches: [main]
    paths:
      - "plugin-factory/**"
      - "vst-testing-ops/business_pipeline.py"
      - ".github/workflows/build-plugin-factory.yml"

jobs:
  factory-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin-factory
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++-12 gcc-12 libasound2-dev libfreetype-dev libgl1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libgtk-3-dev unzip curl xvfb

      - name: Zero-touch factory release (build + verify + pluginval + ship)
        env:
          CI: true
          FACTORY_VST3_INSTALL_DIR: ${{ github.workspace }}/build/factory-shipped-vst3
        run: |
          ./scripts/factory.sh release

      - name: Assert shipped bundles on disk
        run: |
          test -d "$GITHUB_WORKSPACE/build/factory-shipped-vst3"
          ls -la "$GITHUB_WORKSPACE/build/factory-shipped-vst3"
          test "$(find "$GITHUB_WORKSPACE/build/factory-shipped-vst3" -name '*.vst3' -type d | wc -l)" -ge 3
          test -d "$GITHUB_WORKSPACE/build/factory-shipped-vst3/V Voyager.vst3"
