name: Build Plugin Factory OS

on:
  push:
    branches: [main, "cursor/**"]
    paths:
      - "plugin-factory/**"
      - ".github/workflows/build-plugin-factory.yml"
  pull_request:
    branches: [main]
    paths:
      - "plugin-factory/**"
      - ".github/workflows/build-plugin-factory.yml"

jobs:
  linux-vst3:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin-factory
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libasound2-dev libfreetype-dev libgl1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libgtk-3-dev unzip curl xvfb

      - name: Configure and build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-12 -DCMAKE_C_COMPILER=gcc-12
          cmake --build build -j$(nproc) --target ReferenceEffect_VST3 ReferenceSynth_VST3

      - name: Validate VST3 plugins
        env:
          CI: true
        run: |
          python3 ../scripts/vst/run_pluginval.py --install-only
          xvfb-run -a python3 ../scripts/vst/run_pluginval.py \
            --discover build/ReferenceEffect_artefacts/Release/VST3
