name: Build Windows VST3

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows-vst3:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (Ninja Release)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DJDUPGRADED_ENABLE_CLAP=OFF

      - name: Build VST3 plugins
        run: >
          cmake --build build --parallel
          --target PluggVA_VST3 Wave9090_VST3 SP1200_VST3 JDUpgraded_VST3

      - name: Factory preset smoke tests
        run: |
          cmake --build build --target PluggVATests Wave9090Tests
          ctest --test-dir build -R "PluggVA|Wave9090" --output-on-failure

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pluginval (Windows)
        shell: pwsh
        run: |
          $ver = "1.0.4"
          $url = "https://github.com/Tracktion/pluginval/releases/download/v$ver/pluginval_Windows.zip"
          $zip = "$env:RUNNER_TEMP\pluginval.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\pluginval" -Force
          $bin = Get-ChildItem -Path "$env:RUNNER_TEMP\pluginval" -Recurse -Filter "pluginval.exe" | Select-Object -First 1
          if (-not $bin) { throw "pluginval.exe not found in release zip" }
          "PLUGINVAL_BIN=$($bin.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Validate monorepo VST3 bundles (pluginval)
        env:
          CI: true
        run: >
          python scripts/vst/run_pluginval.py
          --discover build/PluggVA/PluggVA_artefacts/Release/VST3
          --discover build/Wave9090/Wave9090_artefacts/Release/VST3
          --discover build/SP1200/SP1200_artefacts/Release/VST3
          --discover build/JDUpgraded_artefacts/Release/VST3

      - name: Stage Plugg VA VST3 for download
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact/plugg-va-vst3 | Out-Null
          $plugg = Get-ChildItem -Path build -Recurse -Directory -Filter "Plugg VA.vst3" | Select-Object -First 1
          if (-not $plugg) {
            Write-Error "Plugg VA.vst3 bundle not found under build/"
          }
          Copy-Item -Recurse -Force $plugg.FullName (Join-Path artifact/plugg-va-vst3 $plugg.Name)
          Get-ChildItem artifact/plugg-va-vst3

      - name: Upload Plugg VA Windows x64 VST3
        uses: actions/upload-artifact@v4
        with:
          name: plugg-va-vst3-windows-x64
          path: artifact/plugg-va-vst3/
          retention-days: 14
          if-no-files-found: error

      - name: Stage VST3 bundles for upload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact/vst3 | Out-Null
          $builtNames = @(
            'Plugg VA.vst3',
            'WAVE-9090.vst3',
            'SP-1200 Drumulator.vst3',
            'JD Upgraded.vst3'
          )
          $bundles = Get-ChildItem -Path build -Recurse -Directory |
            Where-Object { $builtNames -contains $_.Name }
          if (-not $bundles) {
            Write-Error "No .vst3 bundles found under build/"
          }
          foreach ($b in $bundles) {
            Write-Host "Collecting $($b.FullName)"
            Copy-Item -Recurse -Force $b.FullName (Join-Path artifact/vst3 $b.Name)
          }
          Get-ChildItem artifact/vst3

      - name: Upload Windows VST3 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-vst3-${{ github.sha }}
          path: artifact/vst3/
          retention-days: 14
          if-no-files-found: error
