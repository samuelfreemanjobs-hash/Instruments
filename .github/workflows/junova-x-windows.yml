name: Junova-X Windows VST3

on:
  push:
    branches: [main, "cursor/**"]
    paths:
      - "Junova-X/**"
      - ".github/workflows/junova-x-windows.yml"
      - "CMakeLists.txt"
  pull_request:
    branches: [main]
    paths:
      - "Junova-X/**"
      - ".github/workflows/junova-x-windows.yml"
      - "CMakeLists.txt"

jobs:
  windows-vst3:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Activate MSVC x64
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Configure CMake (Ninja Release)
        shell: cmd
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja

      - name: Build Junova-X VST3
        shell: cmd
        run: cmake --build build --target JunovaX_VST3 -j

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: junova-x-vst3-windows-x64
          path: build/Junova-X/JunovaX_artefacts/Release/VST3/Junova-X.vst3/**/*
          if-no-files-found: error