name: Junova-X landing

on:
  push:
    branches: [main, "cursor/**"]
    paths:
      - "disklordz/junova-x-landing/**"
  pull_request:
    paths:
      - "disklordz/junova-x-landing/**"

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: disklordz/junova-x-landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: disklordz/junova-x-landing/package-lock.json
      - run: npm ci
      - run: npm run build
