name: Junova KR-106 smoke

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  kr106-compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++-12 libstdc++-12-dev \
            libasound2-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev \
            libx11-dev libxrandr-dev libxcursor-dev libxinerama-dev libxext-dev \
            libcurl4-openssl-dev

      - name: Configure and build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-12 -DCMAKE_C_COMPILER=gcc-12
          cmake --build build -j --target JunovaOfflineRender SpectralDiff

      - name: KR-106 reference + compare
        run: |
          bash Junova-X/scripts/setup_kr106_reference.sh
          make -C .reference/ultramaster_kr106/tools/render-midi
          bash tests/golden/junova/compare_kr106_golden.sh
