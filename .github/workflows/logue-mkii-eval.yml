name: logue mkII oscillator eval (static)

on:
  pull_request:
    paths:
      - 'src/mkii/**'
      - 'tools/osc-eval-mkii.sh'
      - 'tools/fx-eval-mkii.sh'
      - 'tools/build-mkii.sh'
      - 'tools/build-mkii-fx.sh'
      - 'tools/mkii/**'
      - 'tools/logue/**'
  push:
    branches: [main]
    paths:
      - 'src/mkii/**'
      - 'tools/osc-eval-mkii.sh'

jobs:
  static-golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Static eval (golden + PORT_COMPLETE slugs)
        run: |
          chmod +x tools/osc-eval-mkii.sh tools/logue/list-port-complete-slugs.sh
          ./tools/osc-eval-mkii.sh tr808_kick_phonk --static-only
          while IFS= read -r slug; do
            [ -z "$slug" ] && continue
            [ "$slug" = "tr808_kick_phonk" ] && continue
            ./tools/osc-eval-mkii.sh "$slug" --static-only
          done < <(./tools/logue/list-port-complete-slugs.sh)
      - name: Static eval PORT_COMPLETE FX
        run: |
          chmod +x tools/fx-eval-mkii.sh tools/logue/list-port-complete-fx.sh
          while IFS= read -r slug; do
            [ -z "$slug" ] && continue
            ./tools/fx-eval-mkii.sh "$slug" --static-only
          done < <(./tools/logue/list-port-complete-fx.sh)
