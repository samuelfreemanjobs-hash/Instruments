name: Huckaby Pattern Engine Linux CI

on:
  push:
    branches: [main, "cursor/**"]
    paths:
      - "HuckabyPatternEngine/**"
      - "CMakeLists.txt"
      - ".github/workflows/huckaby-pattern-engine-linux.yml"
  pull_request:
    branches: [main]
    paths:
      - "HuckabyPatternEngine/**"
      - "CMakeLists.txt"
      - ".github/workflows/huckaby-pattern-engine-linux.yml"
  workflow_dispatch:

jobs:
  audio-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and JUCE deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++-12 gcc-12 libstdc++-12-dev cmake ninja-build pkg-config \
            libasound2-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev \
            libx11-dev libxrandr-dev libxcursor-dev libxinerama-dev libxext-dev \
            libcurl4-openssl-dev unzip xvfb

      - name: Configure Release
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-12 -DCMAKE_C_COMPILER=gcc-12 \
            -DINSTRUMENTS_ENABLE_CLAP=OFF

      - name: Build Huckaby targets
        run: cmake --build build -j --target HuckabyPatternEngine_VST3 HuckabyPatternEngine_Smoke HuckabyPatternEngine_AudioQa

      - name: ctest (smoke + audio QA)
        run: ctest --test-dir build -R HuckabyPatternEngine --output-on-failure

      - name: Cache pluginval binary
        run: python3 scripts/vst/run_pluginval.py --install-only

      - name: pluginval strictness 5
        env:
          CI: "true"
        run: |
          xvfb-run -a python3 scripts/vst/run_pluginval.py \
            --discover "build/HuckabyPatternEngine/HuckabyPatternEngine_artefacts/Release/VST3" \
            --strictness-level 5 \
            --timeout-ms 120000