name: VST Preset Factory

on:
  pull_request:
    paths:
      - "Wave9090/**"
      - "PluggVA/**"
      - "Source/Assets/FactoryPatchLibrary.*"
      - "SP1200/Source/Presets/**"
      - "scripts/vst/**"
      - "disklordz/agents/profit/vst-preset-agent/**"
      - "disklordz/integrations/agents/vst_preset_agent.py"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Factory preset counts
        run: python3 scripts/vst/verify_factory_preset_counts.py
      - name: VST Preset Agent self-test
        run: python3 disklordz/integrations/agents/vst_preset_agent.py --self-test
